<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>济豪云打印管理台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #eef4f8;
      --text: #18212f;
      --muted: #657185;
      --line: #dfe6ee;
      --accent: #1976d2;
      --accent-strong: #0f5fb8;
      --ok: #14835d;
      --bad: #c83335;
      --warn: #946200;
      --shadow: 0 10px 30px rgba(24, 33, 47, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 28px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    h2 { margin: 0 0 14px; font-size: 17px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    button, input, select {
      font: inherit;
      min-height: 38px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-strong); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 18px;
      padding: 20px 28px 28px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .device-list {
      display: grid;
      gap: 10px;
    }
    .device-card {
      width: 100%;
      display: block;
      text-align: left;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    .device-card.active {
      border-color: var(--accent);
      outline: 2px solid rgba(25, 118, 210, 0.12);
    }
    .device-top, .split {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.online { background: #e6f6ef; color: var(--ok); }
    .pill.offline, .pill.failed { background: #fdecec; color: var(--bad); }
    .pill.pending, .pill.assigned, .pill.printing { background: #fff4dc; color: var(--warn); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      background: var(--panel-soft);
      border-radius: 8px;
      padding: 12px;
      min-height: 76px;
    }
    .metric b { display: block; font-size: 24px; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
    }
    .kv {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .kv:last-child { border-bottom: 0; }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: #f9fbfd;
    }
    code {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      background: #101820;
      color: #edf5ff;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    form {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    .stack { display: grid; gap: 16px; }
    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: var(--panel-soft);
      border-radius: 8px;
    }
    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; padding: 14px; }
      .grid, .detail-grid { grid-template-columns: 1fr 1fr; }
      form { grid-template-columns: 1fr 1fr; }
      .wide { grid-column: span 2; }
    }
    @media (max-width: 620px) {
      .grid, .detail-grid, form { grid-template-columns: 1fr; }
      .wide { grid-column: span 1; }
      .split { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>济豪云打印管理台</h1>
      <div class="muted small" id="lastRefresh">等待刷新</div>
    </div>
    <div class="toolbar">
      <button type="button" onclick="refreshAll()">刷新</button>
      <button type="button" class="secondary" onclick="toggleAutoRefresh()" id="autoRefreshBtn">自动刷新：关</button>
    </div>
  </header>

  <main>
    <section>
      <div class="split">
        <h2>设备</h2>
        <span class="pill" id="deviceCount">0 台</span>
      </div>
      <div id="deviceList" class="device-list"></div>
    </section>

    <div class="stack">
      <section>
        <div class="grid">
          <div class="metric"><span class="muted small">在线设备</span><b id="onlineCount">0</b></div>
          <div class="metric"><span class="muted small">最近任务</span><b id="jobCount">0</b></div>
          <div class="metric"><span class="muted small">成功任务</span><b id="successCount">0</b></div>
          <div class="metric"><span class="muted small">失败任务</span><b id="failedCount">0</b></div>
        </div>
        <div id="deviceDetail" class="empty">请选择左侧设备</div>
      </section>

      <section>
        <h2>提交打印</h2>
        <form id="uploadForm">
          <label class="wide">文件
            <input type="file" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
          </label>
          <label>份数
            <input type="number" name="copies" min="1" value="1">
          </label>
          <label>纸张
            <select name="paper_size">
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
            </select>
          </label>
          <label>上传 Token
            <input type="password" name="upload_token" placeholder="已配置时必填">
          </label>
          <button type="submit">提交打印</button>
          <div class="full muted small" id="uploadResult">会提交到当前选中的设备。</div>
        </form>
      </section>

      <section>
        <div class="split">
          <h2>最近任务</h2>
          <span class="muted small" id="selectedDeviceLabel"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>状态</th>
                <th>文件</th>
                <th>格式</th>
                <th>大小</th>
                <th>时间</th>
                <th>消息</th>
              </tr>
            </thead>
            <tbody id="jobRows"></tbody>
          </table>
        </div>
      </section>

      <section class="detail-grid">
        <div>
          <h2>设备文件</h2>
          <div id="fileList" class="empty">请选择设备后查看</div>
        </div>
        <div>
          <h2>打印 Profile</h2>
          <div id="profileList" class="empty">加载中</div>
        </div>
      </section>

      <section>
        <h2>打印机能力原始数据</h2>
        <pre id="capabilitiesJson">{}</pre>
      </section>
    </div>
  </main>

  <script>
    const state = {
      devices: [],
      selectedDeviceId: "",
      jobs: [],
      files: null,
      profiles: [],
      timer: null,
    };

    const $ = (id) => document.getElementById(id);

    function html(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function fmtTime(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString();
    }

    function fmtBytes(bytes) {
      const size = Number(bytes || 0);
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    async function getJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || response.statusText);
      return data;
    }

    async function refreshAll() {
      try {
        const [deviceData, profileData] = await Promise.all([
          getJson("/api/devices"),
          getJson("/api/printer-profiles"),
        ]);
        state.devices = deviceData.devices || [];
        state.profiles = profileData.profiles || [];
        if (!state.selectedDeviceId && state.devices[0]) {
          state.selectedDeviceId = state.devices[0].device_id;
        }
        if (state.selectedDeviceId) {
          await refreshSelectedDevice();
        }
        render();
        $("lastRefresh").textContent = `最近刷新：${new Date().toLocaleString()}`;
      } catch (error) {
        $("lastRefresh").textContent = `刷新失败：${error.message}`;
      }
    }

    async function refreshSelectedDevice() {
      if (!state.selectedDeviceId) {
        state.jobs = [];
        state.files = null;
        return;
      }
      const deviceId = encodeURIComponent(state.selectedDeviceId);
      const [jobData, fileData] = await Promise.all([
        getJson(`/api/devices/${deviceId}/jobs`),
        getJson(`/api/devices/${deviceId}/files`),
      ]);
      state.jobs = jobData.jobs || [];
      state.files = fileData;
    }

    async function selectDevice(deviceId) {
      state.selectedDeviceId = deviceId;
      await refreshSelectedDevice();
      render();
    }

    function render() {
      renderDevices();
      renderMetrics();
      renderDetail();
      renderJobs();
      renderFiles();
      renderProfiles();
    }

    function renderDevices() {
      $("deviceCount").textContent = `${state.devices.length} 台`;
      $("deviceList").innerHTML = state.devices.length
        ? state.devices.map((device) => `
          <button type="button" class="device-card ${device.device_id === state.selectedDeviceId ? "active" : ""}" data-device-id="${html(device.device_id)}">
            <div class="device-top">
              <strong>${html(device.device_name || device.device_id)}</strong>
              <span class="pill ${html(device.status)}">${html(device.status)}</span>
            </div>
            <div class="muted small"><code>${html(device.device_id)}</code></div>
            <div class="muted small">最后在线：${fmtTime(device.last_seen_at)}</div>
          </button>
        `).join("")
        : `<div class="empty">暂无设备</div>`;
    }

    function renderMetrics() {
      $("onlineCount").textContent = state.devices.filter((item) => item.status === "online").length;
      $("jobCount").textContent = state.jobs.length;
      $("successCount").textContent = state.jobs.filter((item) => item.status === "succeeded").length;
      $("failedCount").textContent = state.jobs.filter((item) => item.status === "failed").length;
    }

    function renderDetail() {
      const device = state.devices.find((item) => item.device_id === state.selectedDeviceId);
      if (!device) {
        $("deviceDetail").className = "empty";
        $("deviceDetail").innerHTML = "请选择左侧设备";
        $("capabilitiesJson").textContent = "{}";
        $("selectedDeviceLabel").textContent = "";
        return;
      }
      $("deviceDetail").className = "";
      $("deviceDetail").innerHTML = `
        <div class="detail-grid">
          <div>
            <h3>基础信息</h3>
            ${kv("设备编号", `<code>${html(device.device_id)}</code>`)}
            ${kv("设备名称", html(device.device_name))}
            ${kv("在线状态", `<span class="pill ${html(device.status)}">${html(device.status)}</span>`)}
            ${kv("最近在线", fmtTime(device.last_seen_at))}
          </div>
          <div>
            <h3>打印链路</h3>
            ${kv("Profile", `<code>${html(device.printer_profile)}</code>`)}
            ${kv("最近路径", `<code>${html(device.last_request_path || "-")}</code>`)}
            ${kv("最近来源", html(device.last_request_ip || "-"))}
            ${kv("支持格式", html((device.printer_capabilities?.document_format_supported || []).join(", ") || "-"))}
          </div>
        </div>
      `;
      $("capabilitiesJson").textContent = JSON.stringify(device.printer_capabilities || {}, null, 2);
      $("selectedDeviceLabel").textContent = device.device_id;
    }

    function kv(label, value) {
      return `<div class="kv"><span class="muted">${html(label)}</span><span>${value}</span></div>`;
    }

    function renderJobs() {
      $("jobRows").innerHTML = state.jobs.length
        ? state.jobs.map((job) => `
          <tr>
            <td><span class="pill ${html(job.status)}">${html(job.status)}</span></td>
            <td><code>${html(job.original_name)}</code><div class="muted small">${html(job.job_id)}</div></td>
            <td>${html(job.print_format || "-")}<div class="muted small">${html(job.printer_profile || "-")}</div></td>
            <td>${fmtBytes(job.file_size)}</td>
            <td>创建：${fmtTime(job.created_at)}<div class="muted small">更新：${fmtTime(job.updated_at)}</div></td>
            <td>${html(job.message || "-")}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="6" class="muted">暂无任务</td></tr>`;
    }

    function renderFiles() {
      if (!state.files) {
        $("fileList").className = "empty";
        $("fileList").innerHTML = "请选择设备后查看";
        return;
      }
      const original = state.files.files || [];
      const ready = state.files.print_ready_files || [];
      $("fileList").className = "";
      $("fileList").innerHTML = `
        <h3>原始文件</h3>
        ${fileGroup(original)}
        <h3 style="margin-top:14px">转换后文件</h3>
        ${fileGroup(ready)}
      `;
    }

    function fileGroup(files) {
      if (!files.length) return `<div class="empty">暂无文件</div>`;
      return files.slice(0, 12).map((file) => `
        <div class="kv">
          <span><code>${html(file.relative_path)}</code></span>
          <span class="muted">${fmtBytes(file.size)} · ${fmtTime(file.mtime)}</span>
        </div>
      `).join("");
    }

    function renderProfiles() {
      $("profileList").className = "";
      $("profileList").innerHTML = state.profiles.length
        ? state.profiles.map((profile) => `
          <div class="kv">
            <span><code>${html(profile.profile_id)}</code></span>
            <span>${html(profile.display_name)}<div class="muted small">${html(profile.print_format)} · ${html(profile.output_suffix)}</div></span>
          </div>
        `).join("")
        : `<div class="empty">暂无 profile</div>`;
    }

    function toggleAutoRefresh() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
        $("autoRefreshBtn").textContent = "自动刷新：关";
        return;
      }
      state.timer = setInterval(refreshAll, 8000);
      $("autoRefreshBtn").textContent = "自动刷新：开";
      refreshAll();
    }

    $("uploadForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!state.selectedDeviceId) {
        $("uploadResult").textContent = "请先选择设备。";
        return;
      }
      const form = event.currentTarget;
      const file = form.file.files[0];
      if (!file) return;
      const data = new FormData();
      data.append("file", file);
      data.append("device_id", state.selectedDeviceId);
      data.append("user_id", "admin");
      data.append("copies", form.copies.value || "1");
      data.append("paper_size", form.paper_size.value || "A4");
      data.append("upload_token", form.upload_token.value || "");
      $("uploadResult").textContent = "正在提交...";
      try {
        const response = await fetch("/api/jobs", { method: "POST", body: data });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || response.statusText);
        $("uploadResult").textContent = `已提交：${result.job_id}，状态：${result.status}`;
        form.file.value = "";
        await refreshSelectedDevice();
        render();
      } catch (error) {
        $("uploadResult").textContent = `提交失败：${error.message}`;
      }
    });

    $("deviceList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-device-id]");
      if (button) selectDevice(button.dataset.deviceId);
    });

    refreshAll();
  </script>
</body>
</html>
